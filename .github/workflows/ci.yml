name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - backend
          - frontend
          - dao-factory
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            dao-factory/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (backend/frontend)
        if: matrix.package != 'dao-factory'
        run: npm run build

      - name: Lint (frontend)
        if: matrix.package == 'frontend'
        run: npm run lint

      - name: Test (backend/dao-factory)
        if: matrix.package != 'frontend'
        run: npm test

