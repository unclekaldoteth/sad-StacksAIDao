[project]
name = "dao-factory"
description = ""
authors = []
telemetry = false
cache_dir = "./.cache"

# Core DAO Contracts
[contracts.dao-traits]
path = "contracts/dao-traits.clar"
epoch = "3.0"

[contracts.dao-core]
path = "contracts/dao-core.clar"
epoch = "3.0"
depends_on = ["dao-traits"]

[contracts.membership]
path = "contracts/membership.clar"
epoch = "3.0"
depends_on = ["dao-core"]

[contracts.extensions-registry]
path = "contracts/extensions-registry.clar"
epoch = "3.0"
depends_on = ["dao-core"]

# Governance Contracts
[contracts.governance-token]
path = "contracts/governance-token.clar"
epoch = "3.0"
depends_on = ["dao-core"]

[contracts.proposal-submission]
path = "contracts/proposal-submission.clar"
epoch = "3.0"
depends_on = ["dao-core"]

[contracts.proposal-voting]
path = "contracts/proposal-voting.clar"
epoch = "3.0"
depends_on = ["dao-core", "proposal-submission"]

# Treasury Contracts
[contracts.treasury]
path = "contracts/treasury.clar"
epoch = "3.0"
depends_on = ["dao-core"]

[contracts.treasury-actions]
path = "contracts/treasury-actions.clar"
epoch = "3.0"
depends_on = ["dao-core", "treasury"]

# Test Helper Contracts
[contracts.mock-proposal]
path = "contracts/mock-proposal.clar"
epoch = "3.0"
depends_on = ["dao-traits"]

[contracts.test-executor]
path = "contracts/test-executor.clar"
epoch = "3.0"
depends_on = ["dao-core", "dao-traits"]

# Factory Contracts
[contracts.dao-factory]
path = "contracts/dao-factory.clar"
epoch = "3.0"

[contracts.template-registry]
path = "contracts/template-registry.clar"
epoch = "3.0"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = true, trusted_caller = true, callee_filter = true }

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet
